<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" fill="none">
  <g opacity="0.09">
    <!-- Outer faint watermark ring -->
    <circle cx="70" cy="70" r="48" stroke="#000000" stroke-width="4" stroke-dasharray="6 4" />
    <circle cx="70" cy="70" r="42" fill="#000000" opacity="0.15" />

    <!-- Spiky Hair -->
    <path d="M 44 48 C 28 22 46 16 58 24 C 66 12 76 12 82 22 C 94 14 110 26 96 48 Z" fill="#000000" />

    <!-- Head Outline -->
    <ellipse cx="70" cy="70" rx="30" ry="32" fill="#767676" stroke="#000000" stroke-width="4" />

    <!-- Eyeglasses / Sunglasses -->
    <rect x="46" y="58" width="20" height="16" rx="4" fill="#000000" />
    <rect x="74" y="58" width="20" height="16" rx="4" fill="#000000" />
    <line x1="66" y1="65" x2="74" y2="65" stroke="#000000" stroke-width="3" />

    <!-- Glare reflection on glasses -->
    <line x1="50" y1="62" x2="56" y2="71" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="78" y1="62" x2="84" y2="71" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Big Smile -->
    <path d="M 54 84 Q 70 98 86 84" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="70" cy="92" r="2" fill="#000000" />

    <!-- Faint star accents in background tile -->
    <polygon points="18,18 20,24 26,24 21,28 23,34 18,30 13,34 15,28 10,24 16,24" fill="#000000" opacity="0.3" />
    <polygon points="122,122 124,127 129,127 125,130 127,135 122,132 117,135 119,130 115,127 120,127" fill="#000000" opacity="0.3" />
  </g>
</svg>
